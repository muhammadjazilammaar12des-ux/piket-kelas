<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Laporan Piket</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase SDK (Compat Version untuk HTML Statis) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --ios-bg: #F2F2F7;
            --ios-card: #FFFFFF;
            --ios-blue: #007AFF;
            --ios-green: #34C759;
            --ios-red: #FF3B30;
            --ios-text: #000000;
            --ios-text-secondary: #8E8E93;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--ios-bg); margin: 0; height: 100vh; overflow: hidden; }
        #app { height: 100%; width: 100%; overflow-y: auto; scroll-behavior: smooth; }
        .page-enter { animation: slideIn 0.3s cubic-bezier(0.25, 0.8, 0.25, 1) forwards; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .ios-input { width: 100%; padding: 14px 16px; border: 1px solid rgba(0,0,0,0.1); border-radius: 12px; font-size: 16px; box-sizing: border-box; }
        .ios-btn { background-color: var(--ios-blue); color: white; padding: 16px; border-radius: 14px; font-weight: 600; width: 100%; border: none; cursor: pointer; }
        .ios-btn.secondary { background-color: #E5E5EA; color: var(--ios-blue); }
        .ios-card { background: var(--ios-card); border-radius: 20px; padding: 20px; margin-bottom: 16px; }
        .glass-header { background: rgba(242, 242, 247, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 50; }
        .ios-checkbox-wrapper { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #E5E5EA; }
        .ios-checkbox-wrapper:last-child { border-bottom: none; }
        .ios-checkbox { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #C7C7CC; appearance: none; cursor: pointer; position: relative; flex-shrink: 0; }
        .ios-checkbox:checked { background-color: var(--ios-red); border-color: var(--ios-red); }
        .ios-checkbox:checked::after { content: '\2714'; position: absolute; color: white; font-size: 14px; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        #camera-container { position: relative; width: 100%; border-radius: 20px; overflow: hidden; background: #000; aspect-ratio: 3/4; max-height: 50vh; }
        #camera-stream { width: 100%; height: 100%; object-fit: cover; }
        .toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(100px); background: rgba(0,0,0,0.8); color: white; padding: 12px 24px; border-radius: 30px; font-size: 14px; opacity: 0; transition: all 0.3s; z-index: 1000; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>

    <div id="app"></div>
    <div id="toast" class="toast">Message</div>

    <script>
        // ==========================================
        // 1. KODE FIREBASE CONFIG
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyDecOhqp_jEDkZWVkxlhqtPlchq3k6rwXU",
            authDomain: "piket-kelas-46e64.firebaseapp.com",
            projectId: "piket-kelas-46e64",
            storageBucket: "piket-kelas-46e64.firebasestorage.app",
            messagingSenderId: "1014446912711",
            appId: "1:1014446912711:web:841635655d4885e0067ae2",
            measurementId: "G-V89WVGDYLB"
        };
        // Inisialisasi Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        // ==========================================

        let appState = {
            view: 'loading', config: null, stream: null, photoAnggota: null, photoKondisi: null, activePhotoTarget: 'anggota',
        };

        const $ = id => document.getElementById(id);
        const appContainer = $('app');
        
        function showToast(msg) {
            const toast = $('toast'); toast.textContent = msg; toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function render() {
            appContainer.innerHTML = '';
            const wrapper = document.createElement('div');
            wrapper.className = 'page-enter min-h-screen pb-10';

            switch (appState.view) {
                case 'loading': wrapper.innerHTML = renderLoading(); break;
                case 'setup': wrapper.innerHTML = renderSetup(); break;
                case 'home': wrapper.innerHTML = renderHome(); break;
                case 'student': wrapper.innerHTML = renderStudentRoom(); if(appState.view === 'student') setTimeout(initCamera, 300); break;
                case 'teacher': wrapper.innerHTML = renderTeacherRoom(); if(appState.view === 'teacher') loadReports(); break;
            }
            appContainer.appendChild(wrapper); attachEvents();
        }

        function setView(view) {
            if (appState.view === 'student' && view !== 'student') stopCamera();
            appState.view = view; render();
        }

        function renderHeader(title, showBack = false, backView = 'home') {
            return `
                <div class="glass-header px-6 py-4 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        ${showBack ? `<button data-action="back" data-target="${backView}" class="text-[var(--ios-blue)] text-xl"><i class="fa-solid fa-chevron-left"></i></button>` : ''}
                        <h1 class="text-xl font-bold tracking-tight">${title}</h1>
                    </div>
                    <div id="realtime-clock" class="text-sm font-medium text-[var(--ios-text-secondary)]"></div>
                </div>
            `;
        }

        function renderLoading() {
            return `<div class="flex flex-col items-center justify-center h-screen"><i class="fa-solid fa-circle-notch fa-spin text-4xl text-[var(--ios-blue)] mb-4"></i><p class="text-gray-500 font-medium">Memuat Sistem...</p></div>`;
        }

        function renderSetup() {
            const currentTeacher = appState.config?.teacher || '';
            const studentsConf = appState.config?.students || {};
            const getDayData = (day) => studentsConf[day] ? studentsConf[day].join('\n') : '';
            const showBackBtn = appState.config !== null;

            return `
                ${renderHeader('Pengaturan Jadwal Piket', showBackBtn, 'home')}
                <div class="px-6 py-6 max-w-md mx-auto">
                    
                    <div class="ios-card shadow-sm mb-6">
                        <label class="block text-sm font-semibold mb-2">Nama Guru / Wali Kelas</label>
                        <input type="text" id="setup-teacher" class="ios-input" value="${currentTeacher}" placeholder="Contoh: Bpk. Budi">
                    </div>

                    <div class="mb-4">
                        <h3 class="text-lg font-bold mb-1">Daftar Piket (Senin - Jumat)</h3>
                        <p class="text-xs text-gray-500 mb-4">Ketik nama siswa yang piket pada hari terkait. Pisahkan dengan koma (,) atau enter.</p>
                        
                        ${['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat'].map(day => `
                            <div class="ios-card shadow-sm p-4 mb-3">
                                <label class="block text-sm font-bold text-blue-600 mb-2">Piket Hari ${day}</label>
                                <textarea id="setup-${day.toLowerCase()}" class="ios-input text-sm" rows="3" placeholder="Contoh: Alif, Budi, Citra...">${getDayData(day)}</textarea>
                            </div>
                        `).join('')}
                    </div>

                    <button data-action="save-setup" class="ios-btn mt-2 shadow-lg mb-10">Simpan Jadwal Piket</button>
                </div>
            `;
        }

        function renderHome() {
            const teacherName = appState.config?.teacher || 'Wali Kelas';
            return `
                ${renderHeader('Web Piket Online')}
                <div class="px-6 py-8 max-w-md mx-auto flex flex-col items-center justify-center min-h-[70vh]">
                    <div class="w-24 h-24 bg-blue-100 rounded-[24px] flex items-center justify-center mb-6 shadow-sm">
                        <i class="fa-solid fa-cloud text-4xl text-[var(--ios-blue)]"></i>
                    </div>
                    <h2 class="text-2xl font-bold mb-2 text-center">Sistem Laporan Piket</h2>
                    <p class="text-gray-500 text-center mb-10 text-sm">Kelas ${teacherName}</p>

                    <button data-action="go-student" class="ios-btn mb-4 flex items-center justify-center gap-3 shadow-md">
                        <i class="fa-solid fa-camera"></i> Buat Laporan Piket
                    </button>
                    <button data-action="go-teacher" class="ios-btn secondary mb-6 flex items-center justify-center gap-3">
                        <i class="fa-solid fa-chalkboard-user"></i> Masuk Ruang Guru
                    </button>

                    <button data-action="go-setup" class="text-[var(--ios-blue)] font-medium text-sm p-3 hover:bg-blue-50 rounded-lg transition-colors">
                        <i class="fa-solid fa-calendar-days mr-1"></i> Atur Ulang Jadwal Piket
                    </button>
                </div>
            `;
        }

        function renderStudentRoom() {
            const daysIndo = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            const todayName = daysIndo[new Date().getDay()];
            const studentsConfig = appState.config?.students || {};
            const studentsToday = studentsConfig[todayName] || [];
            
            let studentCheckboxes = '';
            if(studentsToday.length > 0) {
                studentCheckboxes = studentsToday.map((name, index) => `
                    <div class="ios-checkbox-wrapper">
                        <label for="student-${index}" class="text-sm font-medium text-gray-800 flex-1 cursor-pointer select-none">${name}</label>
                        <input type="checkbox" id="student-${index}" value="${name}" class="ios-checkbox student-cb">
                    </div>
                `).join('');
            } else {
                studentCheckboxes = `
                    <div class="text-center py-4">
                        <i class="fa-solid fa-face-smile text-3xl text-gray-300 mb-2"></i>
                        <p class="text-sm text-gray-500">Tidak ada jadwal piket untuk hari <b>${todayName}</b>.</p>
                        ${['Sabtu', 'Minggu'].includes(todayName) ? 
                            '<p class="text-xs text-gray-400 mt-1">Selamat menikmati akhir pekan!</p>' : 
                            '<button data-action="go-setup" class="text-xs bg-blue-100 text-blue-700 px-3 py-1 rounded-full mt-2">Cek Pengaturan Jadwal</button>'
                        }
                    </div>
                `;
            }

            return `
                ${renderHeader('Kirim Laporan', true, 'home')}
                <div class="px-4 py-4 max-w-md mx-auto">
                    <div class="mb-4">
                        <h2 class="text-2xl font-bold">Laporan Hari ${todayName}</h2>
                        ${studentsToday.length > 0 ? `<p class="text-sm text-gray-500">Ada ${studentsToday.length} siswa yang piket hari ini.</p>` : ''}
                    </div>

                    <div class="flex gap-2 mb-3">
                        <button data-action="select-target" data-target="anggota" class="flex-1 py-2.5 px-2 rounded-xl text-xs font-semibold border transition-all ${appState.activePhotoTarget === 'anggota' ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-700'}">
                            1. Foto Anggota ${appState.photoAnggota ? '✅' : ''}
                        </button>
                        <button data-action="select-target" data-target="kondisi" class="flex-1 py-2.5 px-2 rounded-xl text-xs font-semibold border transition-all ${appState.activePhotoTarget === 'kondisi' ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-700'}">
                            2. Foto Kelas ${appState.photoKondisi ? '✅' : ''}
                        </button>
                    </div>

                    <div class="ios-card p-2 mb-4">
                        <div id="camera-container" class="shadow-inner">
                            <video id="camera-stream" autoplay playsinline></video>
                        </div>
                        <button data-action="snap-photo" id="btn-snap" class="ios-btn py-3 mt-2"><i class="fa-solid fa-camera"></i> Ambil Foto</button>
                    </div>

                    <div class="ios-card mb-6">
                        <label class="block text-sm font-bold mb-3 text-red-600">
                            <i class="fa-solid fa-triangle-exclamation mr-1"></i> Tandai yang TIDAK HADIR / BOLOS HARI INI:
                        </label>
                        <div class="max-h-56 overflow-y-auto pr-2 bg-gray-50 p-3 rounded-lg border border-gray-100">
                            ${studentCheckboxes}
                        </div>
                    </div>

                    <button data-action="submit-report" id="btn-submit" class="ios-btn bg-green-500 mb-6 shadow-md hover:bg-green-600" ${studentsToday.length === 0 ? 'opacity-50 cursor-not-allowed' : ''}>
                        <i class="fa-solid fa-paper-plane mr-2"></i> Kirim Laporan
                    </button>
                </div>
            `;
        }

        async function initCamera() {
            const video = $('camera-stream');
            if(!video) return;
            try {
                if (!appState.stream || !appState.stream.active) {
                    appState.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }});
                }
                video.srcObject = appState.stream;
                video.onloadedmetadata = () => video.play();
            } catch (err) { alert('Gagal akses kamera. Pastikan izin kamera diberikan.'); }
        }

        function stopCamera() {
            if (appState.stream) { appState.stream.getTracks().forEach(track => track.stop()); appState.stream = null; }
        }

        function takeSnapshot() {
            const video = $('camera-stream');
            if (!video || !video.videoWidth) return;
            const canvas = document.createElement('canvas');
            canvas.width = 400; 
            canvas.height = 400 / (video.videoWidth / video.videoHeight);
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            const base64 = canvas.toDataURL('image/jpeg', 0.4); 

            if (appState.activePhotoTarget === 'anggota') { appState.photoAnggota = base64; appState.activePhotoTarget = 'kondisi'; } 
            else { appState.photoKondisi = base64; }
            render();
        }

        function renderTeacherRoom() {
            // Teks loading dan spinner muter-muter sudah dihilangkan total di sini
            return `
                ${renderHeader('Data Laporan Online', true, 'home')}
                <div class="px-4 py-4 max-w-md mx-auto pb-20">
                    <p class="text-xs text-gray-500 text-center mb-4">Menampilkan maks. 11 laporan terbaru</p>
                    <div id="reports-container"></div>
                </div>
            `;
        }

        function renderReportItem(report) {
            return `
                <div class="ios-card mb-4 shadow-sm">
                    <div class="border-b pb-2 mb-3">
                        <span class="font-bold text-lg">Hari ${report.day}</span><br>
                        <span class="text-sm text-gray-500">${report.dateString}</span>
                    </div>
                    <div class="grid grid-cols-2 gap-3 mb-4">
                        <div>
                            <span class="text-xs font-bold block mb-1 text-gray-600">Anggota Piket:</span>
                            <img src="${report.photoAnggota}" class="w-full aspect-square object-cover rounded-xl border bg-gray-100">
                        </div>
                        <div>
                            <span class="text-xs font-bold block mb-1 text-gray-600">Kondisi Kelas:</span>
                            <img src="${report.photoKondisi}" class="w-full aspect-square object-cover rounded-xl border bg-gray-100">
                        </div>
                    </div>
                    <div class="bg-red-50 p-3 rounded-lg text-sm text-red-800 border border-red-100">
                        <b class="block mb-1">Daftar Tidak Hadir / Tidak Piket:</b>
                        ${report.absentStudents || 'Semua Hadir (Nihil)'}
                    </div>
                </div>
            `;
        }

        function attachEvents() {
            updateClock();
            appContainer.onclick = (e) => {
                const btn = e.target.closest('[data-action]');
                if (!btn) return;
                const action = btn.dataset.action;
                
                if (action === 'back') setView(btn.dataset.target);
                else if (action === 'save-setup') handleSetupSubmit();
                else if (action === 'go-student') setView('student');
                else if (action === 'go-teacher') setView('teacher');
                else if (action === 'go-setup') setView('setup');
                else if (action === 'select-target') { appState.activePhotoTarget = btn.dataset.target; render(); }
                else if (action === 'snap-photo') takeSnapshot();
                else if (action === 'submit-report') submitReportToFirebase();
            };
        }

        function handleSetupSubmit() {
            const teacher = $('setup-teacher').value.trim();
            if (!teacher) { showToast('Harap isi Nama Guru!'); return; }
            const days = ['senin', 'selasa', 'rabu', 'kamis', 'jumat'];
            let groupedStudents = {};
            let totalAdded = 0;

            days.forEach(dayStr => {
                const inputVal = $(`setup-${dayStr}`).value.trim();
                const dayCap = dayStr.charAt(0).toUpperCase() + dayStr.slice(1);
                const studentsArray = inputVal.split(/[\n,]+/).map(s => s.trim()).filter(s => s.length > 0);
                groupedStudents[dayCap] = studentsArray;
                totalAdded += studentsArray.length;
            });

            if(totalAdded === 0){ showToast('Harap isi minimal jadwal piket untuk 1 hari!'); return; }

            const configData = { setupDone: true, teacher: teacher, students: groupedStudents };
            localStorage.setItem('piket_config_fb', JSON.stringify(configData));
            appState.config = configData;
            
            showToast('Jadwal Piket Berhasil Disimpan!');
            setView('home');
        }

        function submitReportToFirebase() {
            if (!appState.photoAnggota || !appState.photoKondisi) { showToast('Silakan ambil Foto Anggota dan Foto Kelas!'); return; }
            
            const btn = $('btn-submit');
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Mengirim Data...';
            btn.disabled = true;

            const daysIndo = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            const now = new Date();
            
            const checkboxes = document.querySelectorAll('.student-cb:checked');
            const absentList = Array.from(checkboxes).map(cb => cb.value);
            const absentString = absentList.length > 0 ? absentList.join(', ') : 'Nihil';

            const reportData = {
                day: daysIndo[now.getDay()],
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                dateString: now.toLocaleDateString('id-ID') + ' ' + now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }),
                absentStudents: absentString,
                photoAnggota: appState.photoAnggota,
                photoKondisi: appState.photoKondisi
            };

            db.collection("reports").add(reportData)
            .then(() => {
                showToast(`Laporan berhasil dikirim ke database!`);
                appState.photoAnggota = null; appState.photoKondisi = null;
                setView('home');
            })
            .catch((error) => {
                console.error("Error adding document: ", error);
                showToast('Gagal mengirim laporan. Cek koneksi internet.');
                btn.innerHTML = '<i class="fa-solid fa-paper-plane mr-2"></i> Coba Lagi'; btn.disabled = false;
            });
        }

        function loadReports() {
            const container = $('reports-container');
            if(!container) return;

            db.collection("reports").orderBy("timestamp", "desc").limit(11).get()
            .then((querySnapshot) => {
                if(querySnapshot.empty) { container.innerHTML = `<div class="text-center mt-10 p-6 bg-white rounded-2xl"><i class="fa-solid fa-box-open text-4xl text-gray-300 mb-3"></i><p class="text-gray-500">Belum ada laporan di database.</p></div>`; return; }
                
                let html = '';
                querySnapshot.forEach((doc) => { html += renderReportItem(doc.data()); });
                container.innerHTML = html;
            })
            .catch((error) => {
                container.innerHTML = `<p class="text-center text-red-500 mt-10">Gagal mengambil data dari server.</p>`;
                console.error("Error getting documents: ", error);
            });
        }

        function initApp() {
            const savedConfig = localStorage.getItem('piket_config_fb');
            if (savedConfig) { 
                appState.config = JSON.parse(savedConfig); 
                if (!appState.config.students || Array.isArray(appState.config.students)) {
                    setView('setup');
                } else {
                    setView('home'); 
                }
            } else { 
                setView('setup'); 
            }
        }

        function updateClock() {
            const clockEl = $('realtime-clock');
            if (clockEl) {
                const now = new Date();
                clockEl.innerHTML = `<b>${now.toLocaleDateString('id-ID', { day: '2-digit', month: 'short' })}</b> <span class="text-[var(--ios-blue)] font-bold">${now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })}</span>`;
            }
        }
        setInterval(updateClock, 1000);
        window.addEventListener('DOMContentLoaded', () => { render(); initApp(); });
    </script>
</body>
</html>
