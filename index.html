<!DOCTYPE html>
<html lang="id" class="light">
<head>
  <meta charset="UTF-8">
  <!-- Perbaikan Ringan: max-scale dihapus untuk aksesibilitas zoom -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Piket & Absensi Kelas</title>

  <!-- TailwindCSS CDN (Dev Only - Disarankan Build Statis untuk Produksi) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>

  <!-- Supabase JS (Pinned version & SRI idealnya ditambahkan di server produksi) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
  
  <!-- Face-API.js untuk deteksi wajah ringan -->
  <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.min.js"></script>
  
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    .panel { display: none; opacity: 0; transition: opacity 0.3s; }
    .panel.active { display: block; opacity: 1; }
    .hidden-force { display: none !important; }
    /* Memastikan toast tidak meluap di HP kecil */
    #toast-container { max-width: 90vw; width: 350px; }
  </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 font-sans min-h-[100dvh] relative pb-10 transition-colors duration-300">

  <!-- TOAST NOTIFICATION -->
  <div id="toast-container" class="fixed top-4 right-1/2 translate-x-1/2 z-[60] flex flex-col gap-2"></div>

  <!-- APP CONTAINER -->
  <div id="app" class="max-w-md mx-auto bg-white dark:bg-gray-800 min-h-[100dvh] shadow-lg relative">
    
    <!-- HEADER -->
    <header class="bg-blue-600 dark:bg-blue-800 text-white p-4 flex justify-between items-center sticky top-0 z-40 shadow">
      <h1 class="font-bold text-lg cursor-pointer" onclick="App.navigate('home')"><i class="fa-solid fa-school"></i> Laporan Piket</h1>
      <button id="btn-theme" onclick="UI.toggleTheme()" class="text-xl p-2"><i class="fa-solid fa-moon"></i></button>
    </header>

    <!-- PANEL 1: HOME -->
    <section id="panel-home" class="panel active p-6 space-y-4 mt-10">
      <div class="text-center mb-8">
        <h2 class="text-2xl font-bold">Selamat Datang</h2>
        <p class="text-gray-500 dark:text-gray-400">Pilih akses Anda di bawah ini</p>
      </div>
      <button onclick="App.navigate('student')" class="w-full bg-blue-600 text-white p-4 rounded-xl shadow font-bold text-lg hover:bg-blue-700 transition">
        <i class="fa-solid fa-user-graduate mr-2"></i> Laporan Siswa
      </button>
      <button onclick="App.navigate('teacher-login')" class="w-full bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200 p-4 rounded-xl shadow font-bold text-lg hover:bg-gray-300 dark:hover:bg-gray-600 transition">
        <i class="fa-solid fa-chalkboard-user mr-2"></i> Ruang Guru
      </button>
    </section>

    <!-- PANEL 2: STUDENT FORM -->
    <section id="panel-student" class="panel p-4 space-y-4">
      <div id="ai-status-banner" class="bg-yellow-50 border border-yellow-200 text-yellow-800 p-3 rounded text-sm flex gap-2 items-start">
        <i class="fa-solid fa-robot mt-1"></i> 
        <span><b>AI Pemeriksa Wajah:</b> Sedang memuat model... pastikan koneksi lancar.</span>
      </div>

      <!-- Kamera Container -->
      <div class="relative bg-black rounded-lg overflow-hidden aspect-[4/3] md:aspect-video shadow-inner flex items-center justify-center">
        <video id="camera-video" class="w-full h-full object-contain hidden-force" autoplay playsinline muted></video>
        <div id="camera-loading" class="text-white text-sm"><i class="fa-solid fa-spinner fa-spin"></i> Membuka Kamera...</div>
        <div id="camera-error" class="absolute inset-0 bg-white dark:bg-gray-800 p-4 hidden-force overflow-y-auto z-10"></div>
        
        <button id="btn-flip-cam" onclick="CameraMod.flip()" class="absolute bottom-2 right-2 bg-black/50 text-white p-3 rounded-full hidden-force z-20">
          <i class="fa-solid fa-camera-rotate"></i>
        </button>
      </div>

      <input id="cap-anggota" type="file" accept="image/*" capture="environment" hidden onchange="Photos.handleFile(event, 'anggota')">
      <input id="cap-kondisi" type="file" accept="image/*" capture="environment" hidden onchange="Photos.handleFile(event, 'kondisi')">

      <div class="grid grid-cols-2 gap-2">
        <div class="flex flex-col gap-1">
          <button onclick="CameraMod.capture('anggota')" class="bg-blue-600 text-white p-2 rounded shadow font-semibold text-sm">
            <i class="fa-solid fa-camera"></i> Foto Anggota
          </button>
          <img id="preview-anggota" class="hidden-force w-full h-20 object-cover rounded border border-gray-300" alt="Preview Anggota">
        </div>
        <div class="flex flex-col gap-1">
          <button onclick="CameraMod.capture('kondisi')" class="bg-blue-600 text-white p-2 rounded shadow font-semibold text-sm">
            <i class="fa-solid fa-camera"></i> Foto Ruangan
          </button>
          <img id="preview-kondisi" class="hidden-force w-full h-20 object-cover rounded border border-gray-300" alt="Preview Ruangan">
        </div>
      </div>

      <button onclick="App.resetStudentPhotos()" class="w-full border border-red-500 text-red-500 p-2 rounded shadow text-sm font-semibold hover:bg-red-50 dark:hover:bg-red-900/20">
        <i class="fa-solid fa-rotate-left"></i> Reset Foto
      </button>

      <!-- Form Absensi -->
      <fieldset id="student-fieldset" disabled class="border rounded shadow p-3 space-y-3 bg-white dark:bg-gray-700 opacity-50 transition-opacity">
        <legend class="text-sm font-bold px-2 text-gray-700 dark:text-gray-200">Daftar Kehadiran Piket</legend>
        <p class="text-xs text-gray-500 dark:text-gray-400 px-2 -mt-2">Centang siswa yang <b>HADIR</b> melaksanakan tugas.</p>
        <div id="student-list" class="space-y-1"></div>
      </fieldset>

      <button id="btn-submit-report" onclick="App.submitReport()" class="w-full bg-green-600 text-white p-3 rounded shadow font-bold text-lg mt-4 hidden-force hover:bg-green-700 transition">
        Kirim Laporan
      </button>
    </section>

    <!-- PANEL 3: TEACHER LOGIN -->
    <section id="panel-teacher-login" class="panel p-6 flex flex-col justify-center min-h-[70vh]">
      <form id="form-teacher-login" onsubmit="Auth.login(event)" class="space-y-4 bg-gray-50 dark:bg-gray-700 p-6 rounded-xl border dark:border-gray-600">
        <h2 class="text-2xl font-bold text-center mb-4">Login Guru</h2>
        <div>
          <label class="block text-sm font-bold mb-1">Email</label>
          <input type="email" id="login-email" required autocomplete="email" class="w-full border p-3 rounded focus:ring-2 focus:ring-blue-500 dark:bg-gray-800 dark:border-gray-600" placeholder="guru@sekolah.com">
        </div>
        <div>
          <label class="block text-sm font-bold mb-1">Password</label>
          <input type="password" id="login-password" required autocomplete="current-password" class="w-full border p-3 rounded focus:ring-2 focus:ring-blue-500 dark:bg-gray-800 dark:border-gray-600">
        </div>
        <button type="submit" id="btn-login" class="w-full bg-blue-600 text-white p-3 rounded font-bold hover:bg-blue-700 flex justify-center items-center gap-2">
          <span>Masuk</span>
        </button>
      </form>
    </section>

    <!-- PANEL 4: TEACHER DASHBOARD -->
    <section id="panel-teacher" class="panel p-4 space-y-4">
      <div class="flex justify-between items-center bg-white dark:bg-gray-800 p-3 rounded shadow border dark:border-gray-700 sticky top-16 z-30">
        <h2 class="text-lg font-bold">Laporan Masuk</h2>
        <button onclick="Auth.logout()" class="text-red-600 border border-red-600 px-3 py-1 rounded text-sm font-bold hover:bg-red-50 dark:hover:bg-red-900/20">
          Logout
        </button>
      </div>
      <div id="teacher-reports-container" class="space-y-3"></div>
      <button id="btn-load-more" onclick="App.renderTeacherReports()" class="w-full bg-gray-200 dark:bg-gray-700 p-3 rounded font-semibold mt-4 hover:bg-gray-300 transition">
        Muat Lebih Banyak
      </button>
    </section>
  </div>

  <!-- MODAL DETAIL GURU -->
  <div id="modal-detail" class="fixed inset-0 bg-black/80 z-50 hidden-force flex flex-col p-4 overflow-y-auto">
    <div class="bg-white dark:bg-gray-800 max-w-md w-full mx-auto p-4 rounded-xl relative mt-10">
      <button onclick="document.getElementById('modal-detail').classList.add('hidden-force')" class="absolute top-3 right-4 text-gray-500 text-2xl hover:text-red-500">&times;</button>
      <h2 class="font-bold text-lg border-b pb-2 mb-3" id="modal-title">Detail Laporan</h2>
      <div id="modal-content" class="space-y-4 text-sm"></div>
    </div>
  </div>

  <script>
    // --- KONFIGURASI UMUM ---
    const CONFIG = {
      // PERINGATAN: Pastikan Anda MENGGANTI URL & KEY ini dengan Supabase project Anda!
      SUPABASE_URL: "https://GANTI_DENGAN_URL_KAMU.supabase.co",
      SUPABASE_KEY: "GANTI_DENGAN_ANON_KEY_KAMU",
      FACE_MODEL_URL: "https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/"
    };

    // --- TIME UTILS ---
    const Time = {
      getLocalDate() {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      },
      getDayName() {
        return new Date().toLocaleDateString('id-ID', { weekday: 'long' });
      }
    };

    // --- UI & STORAGE UTILS ---
    const UI = {
      showToast(msg, isError = false) {
        const t = document.createElement('div');
        t.className = `p-3 rounded shadow text-white text-sm font-bold opacity-0 transition-opacity flex gap-2 items-center ${isError ? 'bg-red-500' : 'bg-green-600'}`;
        t.innerHTML = `<i class="fa-solid ${isError ? 'fa-triangle-exclamation' : 'fa-check-circle'}"></i> <span></span>`;
        t.querySelector('span').textContent = msg; // Aman dari XSS
        
        document.getElementById('toast-container').appendChild(t);
        requestAnimationFrame(() => t.style.opacity = '1');
        setTimeout(() => {
          t.style.opacity = '0';
          setTimeout(() => t.remove(), 300);
        }, 3000);
      },
      
      toggleTheme() {
        const isDark = document.documentElement.classList.toggle('dark');
        try { localStorage.setItem('theme', isDark ? 'dark' : 'light'); } catch(e){}
        document.getElementById('btn-theme').innerHTML = isDark ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
      },

      safeText(el, text) { el.textContent = text; return el; }
    };

    // Cek tema awal
    try {
      if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        UI.toggleTheme();
      }
    } catch(e){}

    // --- DATABASE (SUPABASE) ---
    const DB = {
      _client: null,
      get client() {
        if (!this._client) {
          if (CONFIG.SUPABASE_URL.includes("GANTI_DENGAN")) {
            console.error("URL Supabase belum diatur!");
            return null;
          }
          try {
            this._client = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
          } catch(e) {
            UI.showToast("Gagal inisialisasi Database", true);
          }
        }
        return this._client;
      },

      async checkSession() {
        if (!this.client) return null;
        const { data } = await this.client.auth.getSession();
        return data.session;
      }
    };

    // --- AUTHENTICATION ---
    const Auth = {
      async login(e) {
        e.preventDefault();
        const btn = document.getElementById('btn-login');
        const email = document.getElementById('login-email').value;
        const pass = document.getElementById('login-password').value;
        
        if (!DB.client) { UI.showToast("Konfigurasi DB belum diatur", true); return; }
        
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memproses...';
        
        try {
          const { error } = await DB.client.auth.signInWithPassword({ email, password: pass });
          if (error) throw error;
          
          document.getElementById('login-password').value = ''; // Hapus pass dari memori
          UI.showToast("Berhasil login!");
          App.navigate('teacher', true, true);
        } catch (error) {
          UI.showToast(error.message, true);
        } finally {
          btn.disabled = false;
          btn.innerHTML = 'Masuk';
        }
      },
      
      async logout() {
        if (DB.client) await DB.client.auth.signOut();
        UI.showToast("Berhasil logout");
        App.navigate('home', true, true);
      }
    };

    // --- FACE API ---
    const FaceAI = {
      isReady: false,
      async init() {
        if (typeof faceapi === 'undefined') return;
        try {
          await faceapi.nets.tinyFaceDetector.loadFromUri(CONFIG.FACE_MODEL_URL);
          this.isReady = true;
          const banner = document.getElementById('ai-status-banner');
          banner.className = "bg-green-50 border border-green-200 text-green-800 p-3 rounded text-sm flex gap-2 items-start";
          banner.innerHTML = `<i class="fa-solid fa-robot mt-1"></i> <span><b>AI Siap:</b> Sistem akan menghitung jumlah wajah secara otomatis.</span>`;
        } catch(e) {
          console.warn("Face-API gagal dimuat. Beralih ke mode manual.", e);
          const banner = document.getElementById('ai-status-banner');
          banner.className = "bg-red-50 border border-red-200 text-red-800 p-3 rounded text-sm";
          banner.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> AI Gagal dimuat. Tidak masalah, Anda tetap bisa mengirim foto.`;
        }
      },

      async countFaces(imgElement) {
        if (!this.isReady) return -1; // -1 = AI dilewati
        const detections = await faceapi.detectAllFaces(imgElement, new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.3 }));
        return detections.length;
      }
    };

    // --- MEDIA & KOMPRESI ---
    const Photos = {
      data: { anggota: null, kondisi: null },

      async handleFile(event, type) {
        const file = event.target.files[0];
        event.target.value = ''; // Reset agar file yang sama bisa dipilih lagi
        if (!file) return;
        
        try {
          const base64 = await this.compressFile(file);
          await this.savePhotoData(type, base64);
        } catch(e) {
          UI.showToast("Gagal memproses foto", true);
        }
      },

      // Kompresi via Canvas (Maksimal 1280px) untuk hemat DB
      compressFile(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = event => {
            const img = new Image();
            img.src = event.target.result;
            img.onload = () => {
              const canvas = document.createElement('canvas');
              const MAX_WIDTH = 1280;
              let width = img.width, height = img.height;
              
              if (width > MAX_WIDTH) {
                height = Math.round((height * MAX_WIDTH) / width);
                width = MAX_WIDTH;
              }
              canvas.width = width; canvas.height = height;
              canvas.getContext('2d').drawImage(img, 0, 0, width, height);
              resolve(canvas.toDataURL('image/jpeg', 0.7)); // Kompres ke JPEG 70%
            };
            img.onerror = reject;
          };
          reader.onerror = reject;
        });
      },

      async savePhotoData(type, base64Url) {
        this.data[type] = base64Url;
        
        // Tampilkan Thumbnail Preview
        const previewEl = document.getElementById(`preview-${type}`);
        previewEl.src = base64Url;
        previewEl.classList.remove('hidden-force');

        UI.showToast(`Foto ${type === 'anggota' ? 'Anggota' : 'Ruangan'} siap!`);

        // Lakukan perhitungan Wajah pada foto anggota
        if (type === 'anggota' && FaceAI.isReady) {
           const img = new Image();
           img.src = base64Url;
           img.onload = async () => {
             const count = await FaceAI.countFaces(img);
             UI.showToast(`AI mendeteksi ${count} wajah di foto anggota`);
             this.data.faceCount = count;
           };
        }

        App.checkStudentFormReady();
      }
    };

    const CameraMod = {
      stream: null,
      facing: 'environment',
      startCounter: 0,
      
      async start() {
        this.stop();
        if (App.currentPanel !== 'student') return;

        const video = document.getElementById('camera-video');
        const errBox = document.getElementById('camera-error');
        const loader = document.getElementById('camera-loading');
        
        video.classList.add('hidden-force');
        errBox.classList.add('hidden-force');
        loader.classList.remove('hidden-force');

        if (!window.isSecureContext) {
          this.errorMessage("Aplikasi tidak dalam mode aman (HTTPS). Kamera diblokir browser.");
          return;
        }

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          this.errorMessage("Browser Anda tidak mendukung akses kamera langsung.");
          return;
        }

        const currentStartId = ++this.startCounter;

        try {
          this.stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: this.facing }, width: { ideal: 1280 } },
            audio: false
          });

          // Cegah race condition jika panel ditutup saat menunggu izin
          if (currentStartId !== this.startCounter || App.currentPanel !== 'student') {
            this.stop(); return;
          }

          video.srcObject = this.stream;
          
          // Tangani jika kamera dimatikan sistem (misal direbut aplikasi lain)
          this.stream.getTracks().forEach(track => {
            track.onended = () => {
              if (App.currentPanel === 'student') {
                this.errorMessage("Kamera terputus atau digunakan aplikasi lain.");
              }
            };
          });

          // Putar video (dibungkus try/catch untuk masalah Auto-Play Safari)
          await video.play();
          
          loader.classList.add('hidden-force');
          video.classList.remove('hidden-force');

          // Tampilkan tombol flip jika kamera > 1
          const devices = await navigator.mediaDevices.enumerateDevices();
          if(devices.filter(d => d.kind === 'videoinput').length > 1) {
            document.getElementById('btn-flip-cam').classList.remove('hidden-force');
          }

        } catch (err) {
          let msg = "Terjadi kesalahan.";
          if (err.name === 'NotAllowedError') msg = "Izin kamera ditolak. Silakan izinkan di pengaturan browser Anda.";
          else if (err.name === 'NotFoundError') msg = "Kamera tidak ditemukan di perangkat ini.";
          else if (err.name === 'NotReadableError') msg = "Kamera sedang sibuk digunakan aplikasi lain.";
          
          this.errorMessage(`${msg} (${err.name})`);
        }
      },

      stop() {
        if (this.stream) {
          this.stream.getTracks().forEach(t => t.stop());
          this.stream = null;
        }
      },

      flip() {
        this.facing = this.facing === 'environment' ? 'user' : 'environment';
        this.start();
      },

      errorMessage(msg) {
        document.getElementById('camera-loading').classList.add('hidden-force');
        const errBox = document.getElementById('camera-error');
        
        const isIOSWebView = /(iPhone|iPod|iPad).*AppleWebKit(?!.*Safari)/i.test(navigator.userAgent);
        const warning = isIOSWebView ? "<p class='text-xs text-red-600 mt-2'>⚠️ Buka link ini di aplikasi Safari asli (bukan dari dalam WA/IG).</p>" : "";

        errBox.innerHTML = `
          <div class="text-sm text-red-700 font-bold mb-1">Kamera Gagal</div>
          <div class="text-xs text-gray-600">${msg}</div>
          ${warning}
          <div class="mt-4 space-y-2">
            <button onclick="document.getElementById('cap-anggota').click()" class="w-full bg-blue-600 text-white text-xs py-2 rounded shadow"><i class="fa-solid fa-folder-open"></i> Pilih Foto Anggota</button>
            <button onclick="document.getElementById('cap-kondisi').click()" class="w-full bg-blue-600 text-white text-xs py-2 rounded shadow"><i class="fa-solid fa-folder-open"></i> Pilih Foto Ruangan</button>
            <button onclick="CameraMod.start()" class="w-full bg-gray-200 text-gray-700 text-xs py-2 rounded shadow mt-2">Coba Muat Ulang Kamera</button>
          </div>
        `;
        errBox.classList.remove('hidden-force');
      },

      capture(type) {
        const video = document.getElementById('camera-video');
        // Jika stream mati atau dimensi 0 (belum siap), lempar ke File Input
        if (!this.stream || video.classList.contains('hidden-force') || video.videoWidth === 0) {
           document.getElementById(`cap-${type}`).click();
           return;
        }

        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        Photos.savePhotoData(type, canvas.toDataURL('image/jpeg', 0.8)); // Langsung kompres ke JPEG
      }
    };

    // Bersihkan memori kamera saat app di background
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) CameraMod.stop();
      else if (App.currentPanel === 'student') CameraMod.start();
    });

    // --- APPLICATION LOGIC & ROUTING ---
    const App = {
      currentPanel: 'home',
      isRenderingReports: false,
      reportOffset: 0,
      
      // Mock Data Kelas & Siswa (Idealnya difetch dari DB)
      classData: {
        id: "XII-RPL-1",
        students: [{id: 1, name: "Ahmad Fauzi"}, {id: 2, name: "Budi Santoso"}, {id: 3, name: "Citra Lestari"}, {id: 4, name: "Dina Mariana"}]
      },

      async navigate(panelId, pushState = true, replace = false) {
        const targetPanel = document.getElementById(`panel-${panelId}`);
        if (!targetPanel) return; // Mencegah blank screen jika ID salah

        // Proteksi Ruang Guru
        if (panelId === 'teacher') {
          const session = await DB.checkSession();
          if (!session) {
            UI.showToast("Sesi berakhir, silakan login ulang", true);
            panelId = 'teacher-login';
          }
        }

        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.getElementById(`panel-${panelId}`).classList.add('active');
        
        if (this.currentPanel === 'student') CameraMod.stop();
        if (panelId === 'student') CameraMod.start();
        if (panelId === 'teacher') this.renderTeacherReports(true);

        this.currentPanel = panelId;
        
        if (pushState) {
          if (replace) history.replaceState({ panel: panelId }, '', `#${panelId}`);
          else history.pushState({ panel: panelId }, '', `#${panelId}`);
        }
      },

      renderStudentForm() {
        const container = document.getElementById('student-list');
        container.innerHTML = ''; 
        
        this.classData.students.forEach(siswa => {
          const lbl = document.createElement('label');
          lbl.className = 'flex items-center space-x-3 p-2 border-b dark:border-gray-600 cursor-pointer';
          lbl.innerHTML = `<input type="checkbox" value="${siswa.name}" class="absent-checkbox w-5 h-5 text-blue-600 rounded"> <span class="font-medium">${siswa.name}</span>`;
          container.appendChild(lbl);
        });
      },

      checkStudentFormReady() {
        if (Photos.data['anggota'] && Photos.data['kondisi']) {
          document.getElementById('student-fieldset').removeAttribute('disabled');
          document.getElementById('student-fieldset').classList.remove('opacity-50');
          document.getElementById('btn-submit-report').classList.remove('hidden-force');
        }
      },

      resetStudentPhotos() {
        Photos.data = { anggota: null, kondisi: null };
        document.getElementById('student-fieldset').setAttribute('disabled', 'true');
        document.getElementById('student-fieldset').classList.add('opacity-50');
        document.getElementById('btn-submit-report').classList.add('hidden-force');
        
        // Hapus Preview
        document.getElementById('preview-anggota').classList.add('hidden-force');
        document.getElementById('preview-kondisi').classList.add('hidden-force');

        // Uncheck Wajah
        document.querySelectorAll('.absent-checkbox').forEach(cb => cb.checked = false);
      },

      async submitReport() {
        const btn = document.getElementById('btn-submit-report');
        if (btn.disabled) return;

        // Validasi Offline
        if (!navigator.onLine) {
          UI.showToast("Koneksi internet terputus!", true); return;
        }

        // Ambil Siswa Hadir
        const presentStudents = Array.from(document.querySelectorAll('.absent-checkbox:checked')).map(cb => cb.value);
        
        // Cek AI vs Checkbox (Jika AI menyala)
        if (Photos.data.faceCount !== undefined && Photos.data.faceCount > -1) {
          if (presentStudents.length !== Photos.data.faceCount) {
             const proceed = confirm(`AI mendeteksi ${Photos.data.faceCount} wajah, tapi Anda mencentang ${presentStudents.length} siswa. Tetap kirim?`);
             if (!proceed) return;
          }
        }

        if (presentStudents.length === 0) {
          if(!confirm("Tidak ada siswa yang dicentang. Kirim laporan kosong?")) return;
        }

        const payload = {
          class_id: this.classData.id,
          day_name: Time.getDayName(),
          report_date: Time.getLocalDate(),
          status: 'Menunggu Verifikasi',
          present_list: JSON.stringify(presentStudents),
          photo_members: Photos.data['anggota'],
          photo_room: Photos.data['kondisi']
        };

        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Mengirim...';

        try {
          if (!DB.client) throw new Error("Database belum siap");
          const { error } = await DB.client.from('reports').insert([payload]);
          if (error) throw error;

          UI.showToast("Laporan berhasil dikirim!");
          this.resetStudentPhotos();
          this.navigate('home');
        } catch (err) {
          UI.showToast(`Gagal: ${err.message}`, true);
        } finally {
          btn.disabled = false;
          btn.innerHTML = 'Kirim Laporan';
        }
      },

      async renderTeacherReports(reset = false) {
        if (this.isRenderingReports) return;
        this.isRenderingReports = true;

        const container = document.getElementById('teacher-reports-container');
        const btnLoad = document.getElementById('btn-load-more');

        if (reset) {
          this.reportOffset = 0;
          container.innerHTML = '';
          btnLoad.classList.remove('hidden-force');
        }

        btnLoad.textContent = "Memuat...";
        btnLoad.disabled = true;

        try {
          if (!DB.client) throw new Error("DB Offline");
          
          // CATATAN: Pastikan Supabase memiliki tabel 'reports' dan RLS policy di-set.
          const { data, error } = await DB.client.from('reports')
            .select('id, class_id, day_name, report_date, status') // Jangan fetch foto base64 di List (berat)
            .order('created_at', { ascending: false })
            .range(this.reportOffset, this.reportOffset + 4);
          
          if (error) throw error;

          if (data.length === 0 && this.reportOffset === 0) {
            container.innerHTML = `<div class="p-4 text-center text-gray-500">Belum ada laporan masuk.</div>`;
          }

          data.forEach(report => {
            const card = document.createElement('div');
            card.className = "bg-white dark:bg-gray-800 p-4 rounded-xl shadow border border-gray-100 dark:border-gray-700 cursor-pointer hover:border-blue-400 transition";
            card.onclick = () => this.showReportDetail(report.id);
            
            card.innerHTML = `
              <div class="flex justify-between items-start mb-2">
                <h3 class="font-bold text-gray-800 dark:text-gray-100">${report.class_id}</h3>
                <span class="text-xs px-2 py-1 rounded bg-yellow-100 text-yellow-800 font-semibold">${report.status}</span>
              </div>
              <p class="text-sm text-gray-500 dark:text-gray-400"><i class="fa-regular fa-calendar"></i> ${report.day_name}, ${report.report_date}</p>
            `;
            container.appendChild(card);
          });

          this.reportOffset += data.length;
          if (data.length < 5) btnLoad.classList.add('hidden-force');

        } catch(e) {
          UI.showToast("Gagal memuat daftar laporan", true);
        } finally {
          btnLoad.textContent = "Muat Lebih Banyak";
          btnLoad.disabled = false;
          this.isRenderingReports = false;
        }
      },

      async showReportDetail(id) {
        const modal = document.getElementById('modal-detail');
        const content = document.getElementById('modal-content');
        
        modal.classList.remove('hidden-force');
        content.innerHTML = '<div class="text-center py-4"><i class="fa-solid fa-spinner fa-spin text-2xl"></i><p class="mt-2">Memuat Detail...</p></div>';

        try {
          // Ambil detail + foto base64
          const { data, error } = await DB.client.from('reports').select('*').eq('id', id).single();
          if (error) throw error;

          let listHadir = [];
          try { listHadir = JSON.parse(data.present_list); } catch(e){}

          // Menggunakan DOM manipulation agar aman dari Stored XSS
          content.innerHTML = '';
          
          const metaDiv = document.createElement('div');
          metaDiv.className = "grid grid-cols-2 gap-2 bg-gray-50 dark:bg-gray-700 p-3 rounded";
          metaDiv.innerHTML = `
            <div><span class="text-xs text-gray-500 block">Kelas</span><b id="dt-kelas"></b></div>
            <div><span class="text-xs text-gray-500 block">Tanggal</span><b id="dt-tgl"></b></div>
          `;
          content.appendChild(metaDiv);
          UI.safeText(metaDiv.querySelector('#dt-kelas'), data.class_id);
          UI.safeText(metaDiv.querySelector('#dt-tgl'), `${data.day_name}, ${data.report_date}`);

          const listDiv = document.createElement('div');
          listDiv.innerHTML = `<h3 class="font-bold border-b pb-1 mb-2">Hadir (${listHadir.length})</h3><ul class="list-disc pl-5 text-gray-700 dark:text-gray-300"></ul>`;
          const ul = listDiv.querySelector('ul');
          if(listHadir.length === 0) ul.innerHTML = "<li class='text-red-500'>Tidak ada yang hadir</li>";
          listHadir.forEach(name => {
             const li = document.createElement('li'); li.textContent = name; ul.appendChild(li);
          });
          content.appendChild(listDiv);

          // Render Foto Aman
          const fotoDiv = document.createElement('div');
          fotoDiv.className = "space-y-2 mt-4";
          fotoDiv.innerHTML = `
            <div><p class="font-bold text-xs mb-1">Foto Anggota:</p><img id="img-anggota" class="w-full rounded border" alt="Loading..."></div>
            <div><p class="font-bold text-xs mb-1">Foto Kondisi:</p><img id="img-kondisi" class="w-full rounded border" alt="Loading..."></div>
          `;
          content.appendChild(fotoDiv);
          
          // Hanya pasang src jika dimulai dengan data:image (Keamanan Dasar base64)
          if(data.photo_members && data.photo_members.startsWith('data:image')) fotoDiv.querySelector('#img-anggota').src = data.photo_members;
          if(data.photo_room && data.photo_room.startsWith('data:image')) fotoDiv.querySelector('#img-kondisi').src = data.photo_room;

        } catch(e) {
          content.innerHTML = `<div class="text-red-500 text-center py-4">Gagal memuat detail data.</div>`;
        }
      }
    };

    // --- SETUP AWAL ---
    window.addEventListener('popstate', (e) => {
      App.navigate(e.state?.panel || 'home', false);
    });

    document.addEventListener('DOMContentLoaded', () => {
      history.replaceState({ panel: 'home' }, '', '#home');
      App.renderStudentForm();
      // Inisialisasi Face AI di Background tanpa memblokir UI
      FaceAI.init();
    });

  </script>
</body>
</html>
