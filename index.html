<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Laporan Piket</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase SDK (Compat v10: App, Firestore, Storage) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

    <style>
        :root {
            --ios-bg: #F2F2F7;
            --ios-card: #FFFFFF;
            --ios-blue: #007AFF;
            --ios-green: #34C759;
            --ios-red: #FF3B30;
            --ios-text: #000000;
            --ios-text-secondary: #8E8E93;
            --ios-border: rgba(0,0,0,0.1);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --ios-bg: #000000;
                --ios-card: #1C1C1E;
                --ios-blue: #0A84FF;
                --ios-green: #30D158;
                --ios-red: #FF453A;
                --ios-text: #FFFFFF;
                --ios-text-secondary: #8E8E93;
                --ios-border: rgba(255,255,255,0.15);
            }
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--ios-bg); color: var(--ios-text); margin: 0; height: 100dvh; overflow: hidden; }
        #app { height: 100%; width: 100%; overflow-y: auto; scroll-behavior: smooth; }
        .page-enter { animation: slideIn 0.3s cubic-bezier(0.25, 0.8, 0.25, 1) forwards; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .ios-input { width: 100%; padding: 14px 16px; border: 1px solid var(--ios-border); border-radius: 12px; font-size: 16px; box-sizing: border-box; background: transparent; color: inherit; }
        .ios-btn { background-color: var(--ios-blue); color: white; padding: 16px; border-radius: 14px; font-weight: 600; width: 100%; border: none; cursor: pointer; transition: opacity 0.2s; }
        .ios-btn:active { opacity: 0.8; }
        .ios-btn.secondary { background-color: rgba(120,120,128,0.12); color: var(--ios-blue); }
        .ios-card { background: var(--ios-card); border-radius: 20px; padding: 20px; margin-bottom: 16px; border: 1px solid var(--ios-border); }
        .glass-header { background: rgba(242, 242, 247, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid var(--ios-border); position: sticky; top: 0; z-index: 50; }
        @media (prefers-color-scheme: dark) {
            .glass-header { background: rgba(28, 28, 30, 0.8); }
        }
        .ios-checkbox-wrapper { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--ios-border); }
        .ios-checkbox-wrapper:last-child { border-bottom: none; }
        .ios-checkbox { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--ios-text-secondary); appearance: none; cursor: pointer; position: relative; flex-shrink: 0; }
        .ios-checkbox:checked { background-color: var(--ios-red); border-color: var(--ios-red); }
        .ios-checkbox:checked::after { content: '\2714'; position: absolute; color: white; font-size: 14px; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        #camera-container { position: relative; width: 100%; border-radius: 20px; overflow: hidden; background: #000; }
        #camera-stream { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; }
        .toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(100px); background: rgba(0,0,0,0.85); color: white; padding: 12px 24px; border-radius: 30px; font-size: 14px; opacity: 0; transition: all 0.3s; z-index: 1000; pointer-events: none; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>

    <div id="app"></div>
    <div id="toast" class="toast">Message</div>

    <!-- Modal PIN Keamanan Guru -->
    <div id="pin-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="ios-card w-full max-w-xs text-center shadow-2xl">
            <h3 class="text-lg font-bold mb-2">Autentikasi Guru</h3>
            <p class="text-xs text-[var(--ios-text-secondary)] mb-4">Masukkan 4-digit PIN Guru (Default: 1234)</p>
            <input type="password" id="pin-input" maxlength="4" class="ios-input text-center text-2xl tracking-widest mb-4" placeholder="••••">
            <div class="flex gap-2">
                <button id="pin-cancel" class="ios-btn secondary py-3 text-sm">Batal</button>
                <button id="pin-submit" class="ios-btn py-3 text-sm">Masuk</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. FIREBASE CONFIG & INISIALISASI
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyDecOhqp_jEDkZWVkxlhqtPlchq3k6rwXU",
            authDomain: "piket-kelas-46e64.firebaseapp.com",
            projectId: "piket-kelas-46e64",
            storageBucket: "piket-kelas-46e64.firebasestorage.app",
            messagingSenderId: "1014446912711",
            appId: "1:1014446912711:web:841635655d4885e0067ae2",
            measurementId: "G-V89WVGDYLB"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();

        // Aktifkan Offline Persistence agar data aman saat sinyal buruk
        db.enablePersistence({ synchronizeTabs: true }).catch((err) => {
            console.warn("Persistence note:", err.code);
        });

        // ==========================================
        // 2. STATE APLIKASI & SESSION PERSISTENCE
        // ==========================================
        let appState = {
            view: 'loading', 
            config: null, 
            stream: null, 
            photoAnggota: null, 
            photoKondisi: null, 
            activePhotoTarget: 'anggota', 
            facingMode: 'environment',
            cameraError: false,
            reportsList: [],
            lastDoc: null,
            hasMoreReports: true,
            targetActionAfterAuth: null
        };

        // Pulihkan draft foto/absensi jika ada di sessionStorage (mencegah hilang saat refresh)
        const savedDraft = sessionStorage.getItem('piket_draft_report');
        let draftData = savedDraft ? JSON.parse(savedDraft) : { photoAnggota: null, photoKondisi: null, absents: [] };
        appState.photoAnggota = draftData.photoAnggota;
        appState.photoKondisi = draftData.photoKondisi;

        const $ = id => document.getElementById(id);
        const appContainer = $('app');
        
        function showToast(msg) {
            const toast = $('toast'); toast.textContent = msg; toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Sanitasi XSS sederhana untuk teks aman
        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        function saveDraftToSession() {
            const checkboxes = document.querySelectorAll('.student-cb:checked');
            const absents = Array.from(checkboxes).map(cb => cb.value);
            sessionStorage.setItem('piket_draft_report', JSON.stringify({
                photoAnggota: appState.photoAnggota,
                photoKondisi: appState.photoKondisi,
                absents: absents
            }));
        }

        // ==========================================
        // 3. RENDER SYSTEM & VIEW ROUTING
        // ==========================================
        function render() {
            appContainer.innerHTML = '';
            const wrapper = document.createElement('div');
            wrapper.className = 'page-enter min-h-screen pb-10';

            switch (appState.view) {
                case 'loading': wrapper.innerHTML = renderLoading(); break;
                case 'setup': wrapper.innerHTML = renderSetup(); break;
                case 'home': wrapper.innerHTML = renderHome(); break;
                case 'student': wrapper.innerHTML = renderStudentRoom(); break;
                case 'teacher': wrapper.innerHTML = renderTeacherRoom(); break;
            }
            
            appContainer.appendChild(wrapper); 
            attachEvents();

            if (appState.view === 'student') setTimeout(initCamera, 300);
            if (appState.view === 'teacher' && appState.reportsList.length === 0) loadReportsFirstTime();
        }

        function setView(view) {
            if (appState.view === 'student' && view !== 'student') stopCamera();
            appState.view = view; 
            render();
        }

        function renderHeader(title, showBack = false, backView = 'home') {
            return `
                <div class="glass-header px-6 py-4 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        ${showBack ? `<button data-action="back" data-target="${backView}" class="text-[var(--ios-blue)] text-xl"><i class="fa-solid fa-chevron-left"></i></button>` : ''}
                        <h1 class="text-xl font-bold tracking-tight">${escapeHTML(title)}</h1>
                    </div>
                    <div id="realtime-clock" class="text-sm font-medium text-[var(--ios-text-secondary)]"></div>
                </div>
            `;
        }

        function renderLoading() {
            return `<div class="flex flex-col items-center justify-center h-screen"><i class="fa-solid fa-circle-notch fa-spin text-4xl text-[var(--ios-blue)] mb-4"></i><p class="text-[var(--ios-text-secondary)] font-medium">Memuat Sistem...</p></div>`;
        }

        function renderSetup() {
            const currentTeacher = appState.config?.teacher || '';
            const studentsConf = appState.config?.students || {};
            const getDayData = (day) => studentsConf[day] ? studentsConf[day].join('\n') : '';
            const showBackBtn = appState.config !== null;

            return `
                ${renderHeader('Pengaturan Jadwal Piket', showBackBtn, 'home')}
                <div class="px-6 py-6 max-w-md mx-auto">
                    <div class="ios-card shadow-sm mb-6">
                        <label class="block text-sm font-semibold mb-2">Nama Guru / Wali Kelas</label>
                        <input type="text" id="setup-teacher" class="ios-input" value="${escapeHTML(currentTeacher)}" placeholder="Contoh: Bpk. Budi">
                    </div>
                    <div class="mb-4">
                        <h3 class="text-lg font-bold mb-1">Daftar Piket (Senin - Jumat)</h3>
                        <p class="text-xs text-[var(--ios-text-secondary)] mb-4">Ketik nama siswa yang piket. Pisahkan dengan koma atau enter.</p>
                        ${['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat'].map(day => `
                            <div class="ios-card shadow-sm p-4 mb-3">
                                <label class="block text-sm font-bold text-[var(--ios-blue)] mb-2">Piket Hari ${day}</label>
                                <textarea id="setup-${day.toLowerCase()}" class="ios-input text-sm" rows="3" placeholder="Contoh: Alif, Budi, Citra...">${escapeHTML(getDayData(day))}</textarea>
                            </div>
                        `).join('')}
                    </div>
                    <button data-action="save-setup" class="ios-btn mt-2 shadow-lg mb-10">Simpan Jadwal Piket</button>
                </div>
            `;
        }

        function renderHome() {
            const teacherName = appState.config?.teacher || 'Wali Kelas';
            return `
                ${renderHeader('Web Piket Online')}
                <div class="px-6 py-8 max-w-md mx-auto flex flex-col items-center justify-center min-h-[70vh]">
                    <div class="w-24 h-24 bg-blue-500/10 rounded-[24px] flex items-center justify-center mb-6 shadow-sm">
                        <i class="fa-solid fa-cloud text-4xl text-[var(--ios-blue)]"></i>
                    </div>
                    <h2 class="text-2xl font-bold mb-2 text-center">Sistem Laporan Piket</h2>
                    <p class="text-[var(--ios-text-secondary)] text-center mb-10 text-sm">Kelas ${escapeHTML(teacherName)}</p>
                    <button data-action="go-student" class="ios-btn mb-4 flex items-center justify-center gap-3 shadow-md">
                        <i class="fa-solid fa-camera"></i> Buat Laporan Piket
                    </button>
                    <button data-action="request-auth" data-target="teacher" class="ios-btn secondary mb-6 flex items-center justify-center gap-3">
                        <i class="fa-solid fa-chalkboard-user"></i> Masuk Ruang Guru
                    </button>
                    <button data-action="request-auth" data-target="setup" class="text-[var(--ios-blue)] font-medium text-sm p-3 hover:bg-[var(--ios-blue)]/10 rounded-lg transition-colors">
                        <i class="fa-solid fa-calendar-days mr-1"></i> Atur Ulang Jadwal Piket
                    </button>
                </div>
            `;
        }

        function renderStudentRoom() {
            const daysIndo = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            const todayName = daysIndo[new Date().getDay()];
            const studentsConfig = appState.config?.students || {};
            const studentsToday = studentsConfig[todayName] || [];
            
            let studentCheckboxes = '';
            if(studentsToday.length > 0) {
                studentCheckboxes = studentsToday.map((name, index) => {
                    const isChecked = draftData.absents && draftData.absents.includes(name);
                    return `
                        <div class="ios-checkbox-wrapper">
                            <label for="student-${index}" class="text-sm font-medium flex-1 cursor-pointer select-none">${escapeHTML(name)}</label>
                            <input type="checkbox" id="student-${index}" value="${escapeHTML(name)}" class="ios-checkbox student-cb" ${isChecked ? 'checked' : ''}>
                        </div>
                    `;
                }).join('');
            } else {
                studentCheckboxes = `
                    <div class="text-center py-4">
                        <i class="fa-solid fa-face-smile text-3xl text-[var(--ios-text-secondary)] mb-2"></i>
                        <p class="text-sm text-[var(--ios-text-secondary)]">Tidak ada jadwal piket hari ini (Libur/Weekend).</p>
                    </div>
                `;
            }

            const ratioStyle = appState.activePhotoTarget === 'anggota' ? '9/16' : '16/9';
            const infoRatio = appState.activePhotoTarget === 'anggota' ? 'Potrait (9:16)' : 'Landscape (16:9)';

            let cameraPreviewHtml = '';
            if (appState.cameraError) {
                cameraPreviewHtml = `
                    <div class="flex flex-col items-center justify-center h-64 text-center p-4">
                        <i class="fa-solid fa-triangle-exclamation text-3xl text-red-500 mb-2"></i>
                        <p class="text-xs text-gray-300 mb-3">Gagal mengakses kamera. Pastikan izin kamera aktif pada browser.</p>
                        <button data-action="retry-camera" class="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold">Coba Lagi</button>
                    </div>
                `;
            } else {
                cameraPreviewHtml = `<video id="camera-stream" autoplay playsinline muted></video>`;
            }

            return `
                ${renderHeader('Kirim Laporan', true, 'home')}
                <div class="px-4 py-4 max-w-md mx-auto">
                    <div class="mb-4">
                        <h2 class="text-2xl font-bold">Laporan Hari ${todayName}</h2>
                        ${studentsToday.length > 0 ? `<p class="text-sm text-[var(--ios-text-secondary)]">Ada ${studentsToday.length} siswa piket hari ini.</p>` : ''}
                    </div>

                    <div class="flex gap-2 mb-3">
                        <button data-action="select-target" data-target="anggota" class="flex-1 py-2.5 px-2 rounded-xl text-xs font-semibold border transition-all ${appState.activePhotoTarget === 'anggota' ? 'bg-blue-600 text-white border-blue-600 shadow-md' : 'bg-[var(--ios-card)]'}">
                            1. Foto Anggota ${appState.photoAnggota ? '✅' : ''}
                        </button>
                        <button data-action="select-target" data-target="kondisi" class="flex-1 py-2.5 px-2 rounded-xl text-xs font-semibold border transition-all ${appState.activePhotoTarget === 'kondisi' ? 'bg-blue-600 text-white border-blue-600 shadow-md' : 'bg-[var(--ios-card)]'}">
                            2. Foto Kelas ${appState.photoKondisi ? '✅' : ''}
                        </button>
                    </div>

                    <div class="ios-card p-2 mb-4">
                        <p class="text-center text-xs text-[var(--ios-text-secondary)] mb-2 font-medium"><i class="fa-solid fa-camera mr-1"></i> Mode: ${infoRatio}</p>
                        
                        <div id="camera-container" class="shadow-inner relative" style="aspect-ratio: ${ratioStyle};">
                            ${cameraPreviewHtml}
                            <button data-action="switch-camera" class="absolute top-3 right-3 bg-black/40 text-white w-10 h-10 rounded-full flex items-center justify-center backdrop-blur-sm shadow-lg border border-white/20 active:scale-90 transition-transform">
                                <i class="fa-solid fa-camera-rotate"></i>
                            </button>
                        </div>

                        <button data-action="snap-photo" id="btn-snap" class="ios-btn py-3 mt-3 shadow-md">
                            <i class="fa-solid fa-circle-check mr-1"></i> Ambil Foto ${appState.activePhotoTarget === 'anggota' ? 'Anggota' : 'Kelas'}
                        </button>
                    </div>

                    <div class="ios-card mb-6">
                        <label class="block text-sm font-bold mb-3 text-[var(--ios-red)]">
                            <i class="fa-solid fa-triangle-exclamation mr-1"></i> Tandai yang TIDAK HADIR / BOLOS HARI INI:
                        </label>
                        <div class="max-h-56 overflow-y-auto pr-2 p-3 rounded-lg border border-[var(--ios-border)]">
                            ${studentCheckboxes}
                        </div>
                    </div>

                    <button data-action="submit-report" id="btn-submit" class="ios-btn bg-[var(--ios-green)] mb-6 shadow-md ${studentsToday.length === 0 ? 'opacity-50 cursor-not-allowed' : ''}">
                        <i class="fa-solid fa-paper-plane mr-2"></i> Kirim Laporan
                    </button>
                </div>
            `;
        }

        async function initCamera() {
            const video = $('camera-stream');
            if(!video) return;
            appState.cameraError = false;
            try {
                if (!appState.stream || !appState.stream.active) {
                    appState.stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { 
                            facingMode: appState.facingMode,
                            width: { ideal: 1280 },
                            height: { ideal: 720 }
                        } 
                    });
                }
                video.srcObject = appState.stream;
                video.style.transform = appState.facingMode === 'user' ? 'scaleX(-1)' : 'scaleX(1)';
                video.onloadedmetadata = () => video.play();
            } catch (err) { 
                console.error("Camera access error:", err);
                appState.cameraError = true;
                render();
            }
        }

        function stopCamera() {
            if (appState.stream) { 
                appState.stream.getTracks().forEach(track => track.stop()); 
                appState.stream = null; 
            }
        }

        function takeSnapshot() {
            const video = $('camera-stream');
            if (!video || !video.videoWidth) {
                showToast('Kamera belum siap, tunggu sebentar.');
                return;
            }

            const isAnggota = appState.activePhotoTarget === 'anggota';
            const targetRatio = isAnggota ? (9/16) : (16/9);
            const videoRatio = video.videoWidth / video.videoHeight;

            let sWidth, sHeight, sX, sY;
            if (videoRatio > targetRatio) {
                sHeight = video.videoHeight;
                sWidth = sHeight * targetRatio;
                sX = (video.videoWidth - sWidth) / 2;
                sY = 0;
            } else {
                sWidth = video.videoWidth;
                sHeight = sWidth / targetRatio;
                sX = 0;
                sY = (video.videoHeight - sHeight) / 2;
            }

            const canvas = document.createElement('canvas');
            canvas.width = isAnggota ? 540 : 960; 
            canvas.height = isAnggota ? 960 : 540;

            const ctx = canvas.getContext('2d');
            if (appState.facingMode === 'user') {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }
            ctx.drawImage(video, sX, sY, sWidth, sHeight, 0, 0, canvas.width, canvas.height);
            
            const base64 = canvas.toDataURL('image/jpeg', 0.7); 

            if (isAnggota) { 
                appState.photoAnggota = base64; 
                appState.activePhotoTarget = 'kondisi'; 
            } else { 
                appState.photoKondisi = base64; 
            }
            saveDraftToSession();
            render();
        }

        function renderTeacherRoom() {
            return `
                ${renderHeader('Data Laporan Online', true, 'home')}
                <div class="px-4 py-4 max-w-md mx-auto pb-20">
                    <p class="text-xs text-[var(--ios-text-secondary)] text-center mb-4">Arsip Laporan Piket Kelas</p>
                    <div id="reports-container"></div>
                    <div id="load-more-container" class="text-center mt-4"></div>
                </div>
            `;
        }

        function renderReportItem(report) {
            return `
                <div class="ios-card mb-4 shadow-sm border">
                    <div class="border-b border-[var(--ios-border)] pb-2 mb-3">
                        <span class="font-bold text-lg">Hari ${escapeHTML(report.day)}</span><br>
                        <span class="text-sm text-[var(--ios-text-secondary)]">${escapeHTML(report.dateString)}</span>
                    </div>
                    
                    <div class="mb-4">
                        <span class="text-xs font-bold block mb-2 text-[var(--ios-text-secondary)] bg-[var(--ios-border)]/20 p-1.5 rounded inline-block"><i class="fa-solid fa-users mr-1"></i> Foto Anggota Piket</span>
                        <img src="${escapeHTML(report.photoAnggotaUrl)}" class="w-full rounded-xl border bg-gray-100 shadow-sm" alt="Foto Anggota" loading="lazy">
                    </div>

                    <div class="mb-4">
                        <span class="text-xs font-bold block mb-2 text-[var(--ios-text-secondary)] bg-[var(--ios-border)]/20 p-1.5 rounded inline-block"><i class="fa-solid fa-broom mr-1"></i> Foto Kondisi Kelas</span>
                        <img src="${escapeHTML(report.photoKondisiUrl)}" class="w-full rounded-xl border bg-gray-100 shadow-sm" alt="Foto Kondisi" loading="lazy">
                    </div>

                    <div class="bg-red-500/10 p-3 rounded-lg text-sm text-[var(--ios-red)] border border-red-500/20">
                        <b class="block mb-1">Daftar Tidak Hadir / Tidak Piket:</b>
                        ${escapeHTML(report.absentStudents || 'Semua Hadir (Nihil)')}
                    </div>
                </div>
            `;
        }

        // ==========================================
        // 4. EVENT HANDLERS & INTERACTIONS
        // ==========================================
        function attachEvents() {
            updateClock();
            appContainer.onclick = (e) => {
                const btn = e.target.closest('[data-action]');
                if (!btn) return;
                const action = btn.dataset.action;
                
                if (action === 'back') setView(btn.dataset.target);
                else if (action === 'save-setup') handleSetupSubmit();
                else if (action === 'go-student') setView('student');
                else if (action === 'request-auth') {
                    appState.targetActionAfterAuth = btn.dataset.target;
                    $('pin-input').value = '';
                    $('pin-modal').classList.remove('hidden');$('pin-input').focus();
                }
                else if (action === 'select-target') { 
                    appState.activePhotoTarget = btn.dataset.target; 
                    render(); 
                }
                else if (action === 'snap-photo') takeSnapshot();
                else if (action === 'retry-camera') initCamera();
                else if (action === 'switch-camera') {
                    appState.facingMode = appState.facingMode === 'user' ? 'environment' : 'user';
                    stopCamera();
                    initCamera();
                }
                else if (action === 'submit-report') submitReportToFirebase();
                else if (action === 'load-more') loadMoreReports();
            };

            // Listener checkbox untuk update sessionStorage draft
            document.querySelectorAll('.student-cb').forEach(cb => {
                cb.onchange = saveDraftToSession;
            });
        }

        // Modal PIN Handlers
        $('pin-cancel').onclick = () => $('pin-modal').classList.add('hidden');$('pin-submit').onclick = () => {
            const pin = $('pin-input').value.trim();
            if (pin === '1234') { // PIN Guru default
                $('pin-modal').classList.add('hidden');
                const target = appState.targetActionAfterAuth;
                if (target) setView(target);
            } else {
                showToast('PIN Salah! (Default: 1234)');
            }
        };

        function handleSetupSubmit() {
            const teacher = $('setup-teacher').value.trim();
            if (!teacher) { showToast('Harap isi Nama Guru!'); return; }
            const days = ['senin', 'selasa', 'rabu', 'kamis', 'jumat'];
            let groupedStudents = {};
            let totalAdded = 0;

            days.forEach(dayStr => {
                const inputVal = $(`setup-${dayStr}`).value.trim();
                const dayCap = dayStr.charAt(0).toUpperCase() + dayStr.slice(1);
                const studentsArray = inputVal.split(/[\n,]+/).map(s => s.trim()).filter(s => s.length > 0);
                groupedStudents[dayCap] = studentsArray;
                totalAdded += studentsArray.length;
            });

            if(totalAdded === 0){ showToast('Harap isi minimal jadwal piket untuk 1 hari!'); return; }

            const configData = { setupDone: true, teacher: teacher, students: groupedStudents };
            
            // Simpan ke Cloud Firestore (agar sinkron di semua perangkat)
            db.collection("settings").doc("config").set(configData)
            .then(() => {
                appState.config = configData;
                showToast('Jadwal Piket Berhasil Disimpan ke Cloud!');
                setView('home');
            })
            .catch(err => {
                console.error(err);
                showToast('Gagal menyimpan ke server. Periksa koneksi.');
            });
        }

        // Upload Base64 ke Firebase Storage agar tidak melebihi batas 1MB Firestore
        async function uploadBase64ToStorage(base64Data, path) {
            const res = await fetch(base64Data);
            const blob = await res.blob();
            const ref = storage.ref().child(path);
            const snapshot = await ref.put(blob);
            return await snapshot.ref.getDownloadURL();
        }

        async function submitReportToFirebase() {
            if (!appState.photoAnggota || !appState.photoKondisi) { 
                showToast('Silakan ambil Foto Anggota dan Foto Kelas terlebih dahulu!'); 
                return; 
            }
            
            const btn = $('btn-submit');
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Mengunggah Foto ke Server...';
            btn.disabled = true;

            try {
                const timestampId = Date.now();
                const anggotaUrl = await uploadBase64ToStorage(appState.photoAnggota, `reports/${timestampId}_anggota.jpg`);
                const kondisiUrl = await uploadBase64ToStorage(appState.photoKondisi, `reports/${timestampId}_kondisi.jpg`);

                btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Menyimpan Laporan...';

                const daysIndo = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
                const now = new Date();
                
                const checkboxes = document.querySelectorAll('.student-cb:checked');
                const absentList = Array.from(checkboxes).map(cb => cb.value);
                const absentString = absentList.length > 0 ? absentList.join(', ') : 'Nihil';

                const reportData = {
                    day: daysIndo[now.getDay()],
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    dateString: now.toLocaleDateString('id-ID') + ' ' + now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }),
                    absentStudents: absentString,
                    photoAnggotaUrl: anggotaUrl,
                    photoKondisiUrl: kondisiUrl
                };

                await db.collection("reports").add(reportData);
                
                showToast('Laporan berhasil dikirim!');
                appState.photoAnggota = null; 
                appState.photoKondisi = null;
                sessionStorage.removeItem('piket_draft_report');
                setView('home');
            } catch (error) {
                console.error("Error submitting report: ", error);
                showToast('Gagal mengirim laporan. Periksa koneksi internet.');
                btn.innerHTML = '<i class="fa-solid fa-paper-plane mr-2"></i> Kirim Laporan'; 
                btn.disabled = false;
            }
        }

        function loadReportsFirstTime() {
            const container = $('reports-container');
            const moreContainer = $('load-more-container');
            if(!container) return;

            container.innerHTML = `<div class="text-center py-6"><i class="fa-solid fa-circle-notch fa-spin text-2xl text-[var(--ios-blue)]"></i></div>`;

            db.collection("reports").orderBy("timestamp", "desc").limit(5).get()
            .then((snapshot) => {
                if(snapshot.empty) { 
                    container.innerHTML = `<div class="text-center mt-10 p-6 ios-card"><i class="fa-solid fa-box-open text-4xl text-[var(--ios-text-secondary)] mb-3"></i><p class="text-[var(--ios-text-secondary)]">Belum ada laporan.</p></div>`; 
                    return; 
                }
                
                appState.reportsList = [];
                snapshot.forEach(doc => appState.reportsList.push(doc.data()));
                appState.lastDoc = snapshot.docs[snapshot.docs.length - 1];
                appState.hasMoreReports = snapshot.docs.length === 5;

                renderReportsList();
            })
            .catch((err) => {
                console.error(err);
                container.innerHTML = `<p class="text-center text-[var(--ios-red)] mt-10">Gagal memuat data laporan.</p>`;
            });
        }

        function loadMoreReports() {
            if (!appState.lastDoc) return;
            const moreContainer = $('load-more-container');
            moreContainer.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin text-[var(--ios-blue)]"></i>`;

            db.collection("reports").orderBy("timestamp", "desc").startAfter(appState.lastDoc).limit(5).get()
            .then((snapshot) => {
                if(snapshot.empty) {
                    appState.hasMoreReports = false;
                    renderReportsList();
                    return;
                }
                snapshot.forEach(doc => appState.reportsList.push(doc.data()));
                appState.lastDoc = snapshot.docs[snapshot.docs.length - 1];
                appState.hasMoreReports = snapshot.docs.length === 5;
                renderReportsList();
            });
        }

        function renderReportsList() {
            const container = $('reports-container');
            const moreContainer = $('load-more-container');
            if (!container) return;

            container.innerHTML = appState.reportsList.map(r => renderReportItem(r)).join('');
            
            if (appState.hasMoreReports) {
                moreContainer.innerHTML = `<button data-action="load-more" class="px-6 py-3 bg-[var(--ios-card)] border rounded-xl text-sm font-semibold shadow-sm">Muat Lebih Banyak</button>`;
            } else {
                moreContainer.innerHTML = `<p class="text-xs text-[var(--ios-text-secondary)]">Semua laporan telah ditampilkan.</p>`;
            }
        }

        function initApp() {
            // Ambil config dari Firestore agar tersinkronisasi antar perangkat
            db.collection("settings").doc("config").get()
            .then((doc) => {
                if (doc.exists) {
                    appState.config = doc.data();
                    if (!appState.config.students || Array.isArray(appState.config.students)) {
                        setView('setup');
                    } else {
                        setView('home');
                    }
                } else {
                    setView('setup');
                }
            })
            .catch(() => {
                // Fallback ke localStorage jika offline total saat pertama buka
                const local = localStorage.getItem('piket_config_fb');
                if (local) {
                    appState.config = JSON.parse(local);
                    setView('home');
                } else {
                    setView('setup');
                }
            });
        }

        function updateClock() {
            const clockEl = $('realtime-clock');
            if (clockEl) {
                const now = new Date();
                clockEl.innerHTML = `<b>${now.toLocaleDateString('id-ID', { day: '2-digit', month: 'short' })}</b> <span class="text-[var(--ios-blue)] font-bold">${now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })}</span>`;
            }
        }
        setInterval(updateClock, 1000);
        window.addEventListener('DOMContentLoaded', () => { render(); initApp(); });
    </script>
</body>
</html>
